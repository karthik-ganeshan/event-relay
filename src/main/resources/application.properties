# Datasource (Dev Services for Postgres)
quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.devservices.enabled=true
%dev.quarkus.datasource.devservices.image-name=postgres:16
%prod.quarkus.datasource.devservices.enabled=false
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://db:5432/eventrelay}
%prod.quarkus.datasource.username=${DB_USER:eventrelay}
%prod.quarkus.datasource.password=${DB_PASSWORD:eventrelay}

# Flyway migrations
quarkus.flyway.migrate-at-start=true

# Hibernate JSON mapping (avoid ObjectMapper formatting conflicts)
quarkus.hibernate-orm.mapping.format.global=ignore

# Swagger UI (dev only)
%dev.quarkus.swagger-ui.always-include=true

# HTTP limits
quarkus.http.limits.max-body-size=1M

# Security
eventrelay.auth.api-key=dev-admin-key
%prod.eventrelay.auth.api-key=${EVENTRELAY_API_KEY}

# Rate limiting
eventrelay.ratelimit.create.limit=60
eventrelay.ratelimit.create.window-seconds=60

# Load test profile
%loadtest.eventrelay.ratelimit.create.limit=10000
%loadtest.eventrelay.ratelimit.create.window-seconds=1
%loadtest.eventrelay.auth.api-key=dev-admin-key

# Delivery worker (disabled by default until delivery logic is added)
eventrelay.worker.enabled=false
eventrelay.worker.batch-size=25
eventrelay.worker.poll-interval=5s
eventrelay.worker.request-timeout=5s
eventrelay.worker.retry-base-seconds=5
eventrelay.worker.retry-max-seconds=300
eventrelay.worker.retry-jitter-percent=20
eventrelay.worker.max-attempts=10
eventrelay.worker.max-in-flight-per-destination=2
eventrelay.worker.failure-threshold=3
eventrelay.worker.cooldown-seconds=60

# Metrics
quarkus.micrometer.export.prometheus.enabled=true
quarkus.smallrye-health.root-path=/q/health

# Logging
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] (%t) [req=%X{requestId} delivery=%X{deliveryId} event=%X{eventId} attempt=%X{attempt} outcome=%X{outcome}] %s%e%n

%prod.quarkus.http.host=0.0.0.0
