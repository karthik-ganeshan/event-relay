services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: eventrelay
      POSTGRES_USER: eventrelay
      POSTGRES_PASSWORD: eventrelay
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventrelay -d eventrelay"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - eventrelay-db:/var/lib/postgresql/data
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      QUARKUS_PROFILE: prod
      DB_URL: jdbc:postgresql://db:5432/eventrelay
      DB_USER: eventrelay
      DB_PASSWORD: eventrelay
      EVENTRELAY_API_KEY: dev-admin-key
      EVENTRELAY_WORKER_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/q/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "8080:8080"

volumes:
  eventrelay-db:
