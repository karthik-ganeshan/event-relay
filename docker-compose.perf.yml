services:
  app:
    environment:
      EVENTRELAY_WORKER_ENABLED: "true"
      EVENTRELAY_WORKER_MAX_IN_FLIGHT_PER_DESTINATION: "10"
      EVENTRELAY_WORKER_BATCH_SIZE: "200"
      EVENTRELAY_WORKER_POLL_INTERVAL: "1s"
      EVENTRELAY_RATELIMIT_CREATE_LIMIT: "10000"
      EVENTRELAY_RATELIMIT_CREATE_WINDOW_SECONDS: "1"
  webhook:
    image: mendhak/http-https-echo:31
    environment:
      HTTP_PORT: 8080
