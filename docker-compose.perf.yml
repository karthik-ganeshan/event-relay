services:
  app:
    environment:
      EVENTRELAY_WORKER_ENABLED: "true"
      EVENTRELAY_WORKER_INSTANCE_ID: "worker-1"
      EVENTRELAY_WORKER_MAX_IN_FLIGHT_PER_DESTINATION: "10"
      EVENTRELAY_WORKER_BATCH_SIZE: "200"
      EVENTRELAY_WORKER_POLL_INTERVAL: "1s"
      EVENTRELAY_RATELIMIT_CREATE_LIMIT: "10000"
      EVENTRELAY_RATELIMIT_CREATE_WINDOW_SECONDS: "1"
  worker-2:
    image: event-relay-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      QUARKUS_PROFILE: prod
      DB_URL: jdbc:postgresql://db:5432/eventrelay
      DB_USER: eventrelay
      DB_PASSWORD: eventrelay
      EVENTRELAY_API_KEY: dev-admin-key
      EVENTRELAY_WORKER_ENABLED: "true"
      EVENTRELAY_WORKER_INSTANCE_ID: "worker-2"
      EVENTRELAY_WORKER_MAX_IN_FLIGHT_PER_DESTINATION: "10"
      EVENTRELAY_WORKER_BATCH_SIZE: "200"
      EVENTRELAY_WORKER_POLL_INTERVAL: "1s"
      EVENTRELAY_RATELIMIT_CREATE_LIMIT: "10000"
      EVENTRELAY_RATELIMIT_CREATE_WINDOW_SECONDS: "1"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/q/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
  webhook:
    image: mendhak/http-https-echo:31
    environment:
      HTTP_PORT: 8080
